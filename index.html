:root{--gold:#ffb3cf;--rose:#ff7aa8;--ink:#020c1c;--glow:0 0 20px rgba(255,150,195,.6),0 0 60px rgba(255,143,177,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:#fff;font-family:'Montserrat',sans-serif;overflow:hidden}
html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#gl{z-index:0}
.hasgl #bg{background:none!important}
#bg{z-index:1;background:linear-gradient(#0e86ad 0%,#0a5a85 22%,#073a63 50%,#04203f 78%,#020c1c 100%)}
#fx{z-index:50;pointer-events:none}
.grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.bars::before,.bars::after{content:"";position:fixed;left:0;right:0;height:7vh;background:#000;z-index:55;transition:height 1.6s cubic-bezier(.7,0,.2,1)}
.bars::before{top:0}.bars::after{bottom:0}
.bars.open::before,.bars.open::after{height:0}

.scene{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 6vw;
  opacity:0;visibility:hidden;transform:scale(1.06);filter:blur(14px);
  transition:opacity 1.4s ease,transform 1.8s cubic-bezier(.2,.7,.2,1),filter 1.4s ease,visibility 0s 1.4s}
.scene.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
h2.script,h1.script{font-family:'Romance','Pinyon Script',cursive;font-weight:400;color:var(--gold);text-shadow:var(--glow)}
.eyebrow{letter-spacing:.6em;font-weight:200;font-size:clamp(.7rem,1.6vw,1rem);text-transform:uppercase;opacity:.85}
.btn{margin-top:4vh;padding:14px 38px;border:1px solid rgba(255,150,195,.6);color:var(--gold);background:rgba(255,150,195,.06);border-radius:60px;
  letter-spacing:.35em;font-size:.75rem;text-transform:uppercase;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px);transition:.4s}
.btn:hover{background:rgba(255,150,195,.2);box-shadow:var(--glow);transform:translateY(-2px)}
.btn.pulse{animation:pulse 2.2s infinite}
.btn.pulse.fade-up{animation:fu 1.4s forwards cubic-bezier(.2,.7,.2,1),pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,150,195,.5)}70%{box-shadow:0 0 0 22px rgba(255,150,195,0)}100%{box-shadow:0 0 0 0 rgba(255,150,195,0)}}
.fade-up{opacity:0;transform:translateY(30px);animation:fu 1.4s forwards cubic-bezier(.2,.7,.2,1)}
@keyframes fu{to{opacity:1;transform:none}}
.hidden{display:none!important}

/* intro */
#intro .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,4vw,2.6rem);font-weight:300;letter-spacing:.05em}
#count{font-family:'Cormorant Garamond',serif;font-size:clamp(7rem,28vw,20rem);font-weight:300;line-height:1;color:var(--gold);text-shadow:var(--glow);position:absolute;opacity:0}
#count.tick{animation:tick 1s ease-out}
@keyframes tick{0%{opacity:0;transform:scale(2.4);filter:blur(20px)}30%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1}100%{opacity:0;transform:scale(.8);filter:blur(6px)}}

/* title */
#nameBig{font-family:'Poem','Dancing Script',cursive;font-weight:600;letter-spacing:.02em;font-size:clamp(4.2rem,21vw,11rem);line-height:1.15;padding:.05em .3em .42em;margin-bottom:-.3em;opacity:0;transition:opacity 2.5s;
  background:linear-gradient(90deg,#ffc9dd,#ff7fae,#ff9fc4,#ffc9dd);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:250%;
  will-change:opacity;filter:none}
#nameBig.show{opacity:1}
@keyframes shine{to{background-position:250% 0}}
#sub{margin-top:2vh;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.2rem,3.4vw,2rem);letter-spacing:.05em;text-transform:none;font-weight:300;opacity:0;transition:opacity 2s 3s;max-width:700px}
#title.ready #sub,#title.ready #toStory{opacity:1}
#bdate{position:absolute;left:0;right:0;bottom:4vh;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.35em;color:rgba(255,214,232,.75);font-size:clamp(.9rem,2.6vw,1.2rem);opacity:0;transition:opacity 2s 3.5s;pointer-events:none}
#title.ready #bdate{opacity:1}
#toStory{opacity:0;transition:opacity 2s 4.5s,background .4s,box-shadow .4s,transform .4s}

/* story lines */
#story .line{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(1.7rem,5.2vw,3.4rem);line-height:1.4;max-width:900px;
  opacity:0;filter:blur(16px);transform:translateY(20px) scale(.97);transition:opacity 1.6s,filter 1.6s,transform 2.2s;position:absolute;padding:0 7vw}
#story .line.in{opacity:1;filter:none;transform:none}
#story .line b{font-weight:500;color:var(--gold);text-shadow:var(--glow)}
#days{position:absolute;bottom:14vh;font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;opacity:.7}
#days span{font-family:'Cormorant Garamond',serif;font-size:2.4rem;letter-spacing:.05em;color:var(--gold);margin:0 .4em;font-weight:500}
#storyNext{position:absolute;bottom:20vh}

/* scrapbook cinema */
#gallery{padding:0}
#cine{position:absolute;inset:0;overflow:hidden}
#cine::before,#cine::after{content:"";position:absolute;left:0;right:0;height:7vh;background:#031a33;z-index:8}
#cine::before{top:0}#cine::after{bottom:0}
.spot{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 46%,transparent 38%,rgba(2,20,44,.6) 100%)}
#camera{position:absolute;inset:0;z-index:2}
#board{position:absolute;left:0;top:0;width:1600px;height:1040px;transform-origin:0 0;perspective:2600px;will-change:transform,opacity}
#sheet{position:absolute;inset:0;border-radius:38px;box-shadow:0 60px 160px rgba(0,0,0,.9),0 0 0 2px rgba(255,255,255,.04);
  background:radial-gradient(circle at 28% 18%,#f8f2e7 0,#ece2d0 62%,#e2d5bf 100%)}
#sheet::after{content:"";position:absolute;inset:0;border-radius:38px;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#sheet.pageOut{animation:pgout .8s ease-in forwards}
#sheet.pageIn{animation:pgin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pgout{to{transform:rotateY(-70deg) translateX(-12%);opacity:0;filter:blur(8px)}}
@keyframes pgin{from{transform:rotateY(70deg) translateX(12%);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.it{position:absolute;transition:filter .9s,scale .9s,box-shadow .9s}
.it.dim{filter:brightness(.4) blur(2.5px)}
@keyframes fadein{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes dev{0%{filter:sepia(1) brightness(.12) blur(9px) contrast(1.5)}45%{filter:sepia(.7) brightness(.65) blur(2px)}100%{filter:none}}
/* polaroid */
.pz{width:250px;height:354px;background:#fdfaf3;padding:14px 14px 0;box-shadow:0 12px 30px rgba(60,40,20,.38);z-index:3;cursor:pointer;
  animation:pzdrop .95s cubic-bezier(.2,1.15,.3,1) backwards}
.pz.focus{scale:1.07;z-index:20;box-shadow:0 30px 70px rgba(60,40,20,.55),0 0 90px rgba(255,200,160,.5)}
@keyframes pzdrop{from{opacity:0;transform:translateY(-240px) scale(1.55);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.pz::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:26px;margin-left:-42px;background:rgba(240,210,150,.8);rotate:-3deg;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:2}
.pz.tp1::before{background:rgba(255,170,190,.8);rotate:4deg}.pz.tp2::before{background:rgba(160,205,235,.8);rotate:-5deg}
.pz .ph{width:222px;height:250px;background:#2b2230 center/cover;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:76px}
.pz .ph img,.pz .ph video{width:100%;height:100%;object-fit:cover;display:block}
.pz .ph img{animation:dev 3.2s ease-out backwards;animation-delay:calc(var(--d,0s) + .6s)}
.pz .cap{height:90px;display:flex;align-items:center;justify-content:center;font-family:'Poem','Dancing Script',cursive;font-weight:600;font-size:17px;color:#c2417a;text-align:center;line-height:1.25;padding:0 8px;white-space:pre-line;overflow:hidden}
.stkr{width:130px;height:130px;font-size:92px;display:flex;align-items:center;justify-content:center;z-index:3;animation:pzdrop 1s cubic-bezier(.2,1.15,.3,1) backwards}
/* torn note + sticky */
.noteW{left:580px;top:225px;width:440px;height:590px;z-index:2;filter:drop-shadow(0 8px 18px rgba(60,40,20,.38));animation:fadein 1.3s both}
.noteW.dim{filter:drop-shadow(0 8px 18px rgba(60,40,20,.38)) brightness(.4) blur(2.5px)}
.noteP{position:absolute;inset:0;background:#fffaf1;padding:44px 38px;text-align:center;font-family:'Caveat',cursive;color:#2b2724}
.noteP .hb{font-size:76px;font-weight:700;line-height:.95}
.noteP .nm{font-size:88px;font-weight:700;color:#e0566f;line-height:1;margin:4px 0 16px}
.noteP p{font-size:29px;line-height:1.3;color:#3a3430;white-space:pre-line}
.noteP .sg{margin-top:14px;font-size:27px;color:#6b5f58}
.stkW{left:1228px;top:410px;width:285px;height:225px;z-index:2;rotate:2.5deg;filter:drop-shadow(0 8px 16px rgba(60,40,20,.35));animation:fadein 1.3s .5s both}
.stkW.dim{filter:drop-shadow(0 8px 16px rgba(60,40,20,.35)) brightness(.4) blur(2.5px)}
.stkP{position:absolute;inset:0;background:#f6c3cf;padding:26px 24px;font-family:'Caveat',cursive;font-size:27px;line-height:1.35;color:#43343a;text-align:left;white-space:pre-line}
.lnote{left:88px;top:440px;width:290px;font-family:'Caveat',cursive;font-weight:700;font-size:37px;line-height:1.25;color:#3b3631;rotate:-3deg;white-space:pre-line;z-index:2;animation:fadein 1.3s .7s both}
.dd{font-family:'Caveat',cursive;color:#e0566f;font-size:46px;z-index:2;animation:fadein 1.3s 1s both}
/* lower third + controls */
#lower{position:absolute;left:0;right:0;bottom:0;z-index:7;text-align:center;padding:5vh 8vw 8.5vh;
  background:linear-gradient(transparent,rgba(0,0,0,.72) 55%)}
#cMsg{white-space:pre-line;font-family:'Poem','Dancing Script',cursive;font-weight:600;font-style:normal;font-size:clamp(1.3rem,3.2vh,2rem);line-height:1.45;color:#ffd0e2;min-height:3em;max-width:820px;margin:0 auto;text-align:center;text-shadow:0 0 20px rgba(255,140,185,.5),0 3px 16px rgba(0,20,50,.95)}
#dots{display:flex;gap:7px;justify-content:center;margin-top:1vh;flex-wrap:wrap}
#dots i{display:block;width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.28);position:relative;overflow:hidden;transition:width .6s,background .6s;cursor:pointer}
#dots i.done{background:var(--gold)}
#dots i.on{width:34px}
#dots i.on::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fill var(--dur,8s) linear forwards}
#cine.paused #dots i.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrow,.ctl{position:absolute;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,150,195,.45);background:rgba(0,0,0,.45);color:var(--gold);font-size:1.4rem;cursor:pointer;backdrop-filter:blur(6px);transition:.3s}
.arrow:hover,.ctl:hover{background:rgba(255,150,195,.2)}
.arrow{top:46%}#prev{left:2vw}#next{right:2vw}
.ctl{top:calc(7vh + 12px);left:16px;font-size:.9rem}#snd{left:68px}
.hint{font-size:.7rem;letter-spacing:.3em;opacity:.55;text-transform:uppercase}

/* cake */
#cake h2{font-size:clamp(2.2rem,6vw,4.2rem)}
.cakewrap{position:relative;width:280px;height:260px;margin:5vh 0 2vh}
.plate{position:absolute;bottom:0;left:-20px;right:-20px;height:14px;border-radius:50%;background:radial-gradient(#ddd,#777);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px}
.t1{bottom:12px;width:280px;height:90px;background:linear-gradient(#ff9ec0,#e0507f)}
.t2{bottom:100px;width:200px;height:70px;background:linear-gradient(#ffe3ba,#f0b878)}
.t3{bottom:168px;width:120px;height:55px;background:linear-gradient(#ff9ec0,#e0507f)}
.icing{position:absolute;left:0;right:0;top:-8px;height:22px;background:#fff;border-radius:14px;
  -webkit-mask:radial-gradient(circle 10px at 10px 14px,#000 98%,transparent) 0 0/26px 100% repeat-x,linear-gradient(#000 0 0) 0 0/100% 12px no-repeat;
  mask:radial-gradient(circle 10px at 10px 14px,#000 98%,transparent) 0 0/26px 100% repeat-x,linear-gradient(#000 0 0) 0 0/100% 12px no-repeat}
.candles{position:absolute;bottom:222px;left:50%;transform:translateX(-50%);display:flex;gap:18px}
.candle{position:relative;width:12px;height:50px;background:repeating-linear-gradient(-45deg,#fff 0 6px,#8ec5ff 6px 12px);border-radius:3px;cursor:pointer}
.flame{position:absolute;left:50%;bottom:100%;width:14px;height:26px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 80%,#fff 0,#ffe27a 35%,#ff9a2e 75%);transform-origin:50% 100%;animation:flick .18s infinite alternate;box-shadow:0 0 25px 10px rgba(255,170,60,.55);transition:opacity .5s,transform .5s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
.candle.out .flame{opacity:0;transform:scale(0)}
.smoke{position:absolute;left:50%;bottom:100%;width:6px;height:6px;border-radius:50%;background:rgba(220,220,220,.6);filter:blur(4px);animation:smoke 2.2s forwards}
@keyframes smoke{to{transform:translate(20px,-90px) scale(6);opacity:0}}
#wish{min-height:1.6em;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.5rem;color:#ffe8f1}

/* letter */
.paper{max-width:720px;width:100%;max-height:70vh;overflow-y:auto;padding:5vh 6vw;background:rgba(255,255,255,.05);border:1px solid rgba(255,150,195,.25);border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:left;scrollbar-width:none}
.paper h3{font-family:'Romance','Pinyon Script',cursive;font-size:clamp(2.2rem,6vw,3.4rem);color:var(--gold);font-weight:400;margin-bottom:2vh}
#typed{font-family:'Cormorant Garamond',serif;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.75;white-space:pre-wrap;font-weight:500;color:#fdf1dc}
#typed::after{content:"|";animation:blink 1s infinite;color:var(--gold)}
#typed.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.sign{font-family:'Romance','Pinyon Script',cursive;font-size:2.4rem;color:var(--rose);margin-top:2vh;opacity:0;transition:opacity 2s}

/* gift */
.gift{position:relative;width:200px;height:200px;margin:4vh auto;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(2deg)}}
.gift .box{position:absolute;bottom:0;left:10px;right:10px;height:130px;background:linear-gradient(135deg,#d6336c,#8e1b4c);border-radius:6px}
.gift .box::before,.gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;margin-left:-15px;background:linear-gradient(90deg,#ffb3cf,#fff1c4,#ffb3cf)}
.gift .lid{position:absolute;bottom:122px;left:0;right:0;height:50px;background:linear-gradient(135deg,#e8467f,#a32459);border-radius:6px;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1),opacity 1.2s;transform-origin:left bottom}
.gift .lid::after{content:"🎀";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:3rem}
.gift.open{animation:none}
.gift.open .lid{transform:translate(60px,-220px) rotate(35deg);opacity:0}
#finalTxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 7vw;opacity:0;transition:opacity 2s;pointer-events:none;
  background:radial-gradient(ellipse 58% 44% at 50% 50%,rgba(5,6,15,.8) 0,rgba(5,6,15,.5) 55%,transparent 100%)}
#finalTxt button{pointer-events:auto}
#finalTxt h1,#finalTxt .msg{text-shadow:0 2px 14px #000,0 0 30px rgba(0,0,0,.8)}
#final .msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.2rem,3vw,2rem);max-width:640px;margin-top:2vh;line-height:1.6}

#music{position:fixed;top:calc(7vh + 12px);right:16px;z-index:70;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,150,195,.5);background:rgba(0,0,0,.4);color:var(--gold);cursor:pointer;font-size:1.1rem;display:none}
#skip{position:fixed;bottom:calc(7vh + 8px);left:16px;z-index:70;font-size:.65rem;letter-spacing:.25em;opacity:.3;cursor:pointer;display:none;text-transform:uppercase;background:none;border:0;color:#fff}
#skip:hover{opacity:.9}

/* ===== extras ===== */
/* lock */
#lock input,#wishIn{margin-top:3vh;width:min(420px,80vw);padding:14px 22px;border-radius:60px;border:1px solid rgba(255,150,195,.55);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-family:'Cormorant Garamond',serif;font-size:1.3rem;text-align:center;outline:none;backdrop-filter:blur(6px)}
#lock input:focus,#wishIn:focus{box-shadow:var(--glow)}
#lockQ{font-size:clamp(2rem,6vw,3.6rem);max-width:780px;line-height:1.2;margin-top:2vh}
#lockHint{margin-top:2vh;min-height:1.2em;transition:opacity .5s}
#lock.shake input{animation:shk .5s}
#pinDots{display:none;gap:16px;justify-content:center;margin:3vh 0 1vh}
#pinDots i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,150,195,.8);transition:.2s}
#pinDots i.on{background:#ff9cc4;box-shadow:0 0 14px rgba(255,140,185,.8)}
#pinPad{display:none;grid-template-columns:repeat(3,68px);gap:14px;justify-content:center;margin:2vh auto}
#pinPad button{width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,150,195,.5);background:rgba(255,255,255,.07);color:#fff;font:600 1.6rem 'Cormorant Garamond',serif;cursor:pointer;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
#pinPad button:active{background:rgba(255,150,195,.35)}
#lock.pin #pinDots{display:flex}#lock.pin #pinPad{display:grid}#lock.pin #lockIn,#lock.pin #lockGo,#lock.pin .eyebrow,#lock.pin #lockQ,#lock.pin #lockHint{display:none}
#lock.shake #pinDots{animation:shk .5s}
body.lockmode #gl,body.lockmode #bg,body.lockmode #fx{display:none!important}body.lockmode{background:#050a14!important}

@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* trailer */
#trailer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw;pointer-events:none}
.tl{position:absolute;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(2rem,7vw,4.6rem);letter-spacing:.06em;
  opacity:0;filter:blur(18px);transform:scale(1.14);transition:opacity 1.3s,filter 1.3s,transform 2.2s cubic-bezier(.2,.7,.2,1)}
.tl.in{opacity:1;filter:none;transform:none}
.tl b{color:var(--gold);font-weight:500;text-shadow:var(--glow)}
.tt{font-family:'Romance','Pinyon Script',cursive;font-style:normal;font-size:clamp(4.5rem,18vw,10rem);color:var(--gold);text-shadow:var(--glow);line-height:1.1}
.tt2{font-family:'Montserrat',sans-serif;font-style:normal;letter-spacing:.7em;text-transform:uppercase;font-size:.8rem;opacity:.8;margin-top:1vh}
/* envelopes */
#envelopes h2{font-size:clamp(2.2rem,6vw,4rem)}
#envRow{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center;max-width:1000px;margin:6vh 0 4vh}
.env{width:150px;height:105px;position:relative;cursor:pointer;perspective:700px;transition:transform .4s;margin-bottom:34px}
.env:hover{transform:translateY(-8px) rotate(-2deg)}
.env .bk{position:absolute;inset:0;background:linear-gradient(135deg,#f3d9c4,#e2b393);border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.env .fl{position:absolute;left:0;right:0;top:0;height:62px;background:linear-gradient(#e6bfa2,#d6a283);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.3,1,.4,1);z-index:3}
.env .ft{position:absolute;inset:0;background:linear-gradient(135deg,#f8e6d6,#ecc9ad);clip-path:polygon(0 28%,50% 62%,100% 28%,100% 100%,0 100%);border-radius:0 0 6px 6px;z-index:2}
.env .hl{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:1.5rem;color:#d6336c;z-index:4;transition:opacity .4s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.env.open .fl{transform:rotateX(180deg);z-index:1}.env.open .hl{opacity:0}
.env .lb{position:absolute;bottom:-36px;left:-10px;right:-10px;text-align:center;font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;color:#ffe8f1;line-height:1}
.env.read .lb::after{content:" ✓";color:var(--gold)}
#envCard,#cardView{position:fixed;inset:0;z-index:60;background:rgba(3,3,12,.88);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8vh 6vw;opacity:0;visibility:hidden;transition:.6s;cursor:pointer;text-align:center}
#envCard.on,#cardView.on{opacity:1;visibility:visible}
#envPaper{background:#fffaf1;color:#2b2724;border-radius:6px;padding:5vh 6vw;max-width:560px;width:100%;box-shadow:0 30px 100px rgba(255,143,177,.35);transform:rotate(-1.5deg) translateY(30px) scale(.94);transition:transform 1s cubic-bezier(.2,1.2,.3,1)}
#envCard.on #envPaper{transform:rotate(-1deg)}
#envLbl{font-family:'Caveat',cursive;font-weight:700;font-size:2.4rem;color:#e0566f}
#envTxt{font-family:'Caveat',cursive;font-size:clamp(1.4rem,3.4vw,1.9rem);line-height:1.35;margin-top:1.5vh;min-height:5em;white-space:pre-wrap}
/* wish lantern */
#wishBox{margin-top:2vh}
#wishBox .btn{margin-top:2vh}
#wishSkip{display:block;margin:2vh auto 0;background:none;border:0;color:#fff;opacity:.35;font-size:.65rem;letter-spacing:.25em;cursor:pointer;text-transform:uppercase}
.lantern{position:fixed;left:50%;bottom:-160px;width:120px;height:150px;margin-left:-60px;z-index:30;pointer-events:none;animation:lrise 12s ease-in forwards}
.lbody{width:100%;height:100%;border-radius:45% 45% 38% 38%/38% 38% 50% 50%;background:radial-gradient(circle at 50% 70%,#fff3b0,#ffb347 55%,#e0662b);
  box-shadow:0 0 60px 24px rgba(255,170,60,.55);display:flex;align-items:center;justify-content:center;padding:20px 16px;text-align:center;
  font-family:'Caveat',cursive;font-weight:700;font-size:1.1rem;color:#5a2200;line-height:1.05;overflow:hidden;animation:sway 3s ease-in-out infinite alternate}
@keyframes lrise{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:1}50%{transform:translate(50px,-58vh) scale(.82)}100%{transform:translate(-40px,-135vh) scale(.3);opacity:.15}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* cake text */
.cnm{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:'Romance','Pinyon Script',cursive;font-size:40px;color:#b0305a;line-height:1}
.cnm2{position:absolute;left:0;right:0;top:30px;text-align:center;font-family:'Caveat',cursive;font-weight:700;font-size:28px;color:#fff;text-shadow:0 1px 3px rgba(120,20,60,.7)}
/* birthday card */
#cardPoster{height:min(78vh,760px);aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:18px;padding:5% 6%;
  background:radial-gradient(circle at 30% 20%,#3a1a6e 0,#14082e 55%,#05030f 100%);border:2px solid rgba(255,150,195,.6);box-shadow:0 30px 120px rgba(255,143,177,.35),inset 0 0 80px rgba(255,143,177,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:default}
#cardPoster .st{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 12%,#fff,transparent),radial-gradient(2px 2px at 65% 40%,#ffe0ec,transparent),radial-gradient(1.5px 1.5px at 20% 62%,#fff,transparent),radial-gradient(2px 2px at 90% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 90%,#ffe0ec,transparent),radial-gradient(1.5px 1.5px at 8% 88%,#fff,transparent)}
#cardPoster>*{position:relative}
.cp1{font-family:'Montserrat',sans-serif;letter-spacing:.55em;text-transform:uppercase;font-size:clamp(.6rem,1.6vh,.9rem);color:#ffe8f1}
.cp2{font-family:'Romance','Pinyon Script',cursive;font-size:clamp(3.4rem,10vh,6rem);line-height:1;background:linear-gradient(90deg,#ffb3cf,#ff8fb1,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,143,177,.5))}
.cpp{width:46%;aspect-ratio:1/1.1;background:#fdfaf3;padding:3% 3% 12%;rotate:-3deg;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.cpp img,.cpp .cpe{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,#3b1d6e,#d6336c)}
.cp3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.9rem,2.2vh,1.25rem);line-height:1.5;color:#fbe6d4;max-width:88%}
.cp4{font-size:.65rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.8}
.bf{position:absolute!important;font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,143,177,.8))}

/* ===== MARINE THEME OVERRIDES ===== */
.lantern{width:150px;height:150px;margin-left:-75px}
.lbody{border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),rgba(170,235,255,.18) 40%,rgba(70,170,255,.14));border:2px solid rgba(210,248,255,.65);
  box-shadow:0 0 50px 14px rgba(120,220,255,.35),inset 0 0 34px rgba(255,255,255,.28);animation:none}
.gift .box{background:repeating-linear-gradient(90deg,#7b4a22 0 26px,#5f3716 26px 28px);border:3px solid #d9b45a;border-radius:6px 6px 10px 10px;box-shadow:0 0 40px rgba(255,214,120,.35)}
.gift .lid{background:repeating-linear-gradient(90deg,#8a5528 0 26px,#6a3d1a 26px 28px);border:3px solid #d9b45a;border-radius:70px 70px 6px 6px}
.gift .box::before,.gift .lid::before{background:linear-gradient(90deg,#d9b45a,#fff1b0,#d9b45a)}
.gift .lid::after{content:"🐚";top:-30px}
.btn:hover{box-shadow:var(--glow)}
#fsBtn{position:fixed;top:calc(7vh + 12px);right:68px;z-index:70;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,150,195,.5);background:rgba(0,0,0,.4);color:var(--gold);cursor:pointer;font-size:1.1rem}

#chap{position:fixed;left:7vw;bottom:15vh;z-index:58;pointer-events:none;opacity:0}
#chap .c1{font-size:.72rem;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 12px rgba(0,30,60,.9)}
#chap .ln{height:1px;width:0;margin:1.2vh 0;background:linear-gradient(90deg,var(--gold),transparent)}
#chap .c2{font-family:'Romance','Pinyon Script',cursive;font-size:clamp(2.4rem,6vw,4.4rem);color:#fff;line-height:1.05;text-shadow:0 4px 24px rgba(0,30,60,.95),0 0 30px rgba(255,150,195,.35)}
#chap.show{animation:chapIn 6.5s ease forwards}#chap.show .ln{animation:chapLn 4s ease forwards}
@keyframes chapIn{0%{opacity:0;transform:translateX(26px)}14%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-10px)}}
@keyframes chapLn{0%{width:0}25%{width:min(340px,55vw)}100%{width:min(340px,55vw)}}
.leak{position:fixed;inset:-10%;z-index:58;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(ellipse 38% 55% at 8% 18%,rgba(255,205,150,.32),transparent 70%),radial-gradient(ellipse 34% 48% at 92% 82%,rgba(120,225,255,.28),transparent 70%);animation:leak 16s ease-in-out infinite}
@keyframes leak{0%,100%{opacity:0;transform:translateX(-4%)}45%,55%{opacity:.4;transform:translateX(4%)}}

/* cake scene: frosted text backing */
#cake h2.script,#cake .hint,#cake #wishBox{background:rgba(3,28,56,.38);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(160,235,255,.18);box-shadow:0 8px 30px rgba(0,15,35,.35)}
#cake h2.script{display:inline-block;padding:.1em .6em .22em;border-radius:22px}
#cake .hint{display:inline-block;padding:10px 20px;border-radius:40px;opacity:.9}
#cake #wishBox{padding:16px 22px 12px;border-radius:24px}
#cake #wishBox .hint{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 0 8px;display:block}
#nameBig{-webkit-text-stroke:0;filter:none}
h2.script,h1.script{-webkit-text-stroke:0}

/* personal whisper lines (replaces chapter titles) */
#chap{left:0;right:0;bottom:6vh;text-align:center;padding:0 8vw}
#chap .c1,#chap .ln{display:none}
#chap{bottom:auto!important;top:9vh}
#chap .c2{display:block;font-family:'Poem','Dancing Script',cursive;font-style:normal;font-weight:600;font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.3;color:#ffd0e2;text-shadow:0 0 22px rgba(255,140,185,.55),0 3px 18px rgba(0,30,60,.9),0 0 3px rgba(0,30,60,.5)}
#chap .c2 i{font-style:normal;display:inline-block;opacity:0;filter:blur(10px);transform:translateY(10px);animation:chL 1.1s ease forwards}
#chap .c2 i.sp{width:.3em}
@keyframes chL{to{opacity:1;filter:none;transform:none}}
@keyframes chapIn{0%{opacity:0;transform:translateY(14px)}16%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.env{margin-bottom:62px}.env .lb{bottom:-58px;left:-18px;right:-18px;line-height:1.05}
@media(min-width:700px){.env{width:190px;height:133px;margin-bottom:70px}.env .fl{height:78px}.env .lb{font-size:1.6rem;bottom:-66px}}

.bloom,.bring{position:fixed;z-index:57;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
.bloom{width:30px;height:30px;background:radial-gradient(circle,rgba(255,240,248,.95),rgba(255,160,200,.4) 40%,transparent 70%);animation:bloomA 2.2s ease-out forwards}
.bring{border:2px solid rgba(255,225,240,.85);box-shadow:0 0 30px rgba(255,150,200,.6);animation:ringA 2.6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bloomA{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(70);opacity:0}}
@keyframes ringA{0%{width:20px;height:20px;opacity:1}100%{width:1500px;height:1500px;opacity:0}}

/* treasure chest */
.gift{width:min(300px,62vw);height:min(250px,52vw);margin:3vh auto}
.gift .chest{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 24px rgba(0,20,40,.5)) drop-shadow(0 0 28px rgba(255,205,110,.28))}
.gift .treasure{opacity:0;transition:opacity .6s .5s}
.gift .lidg{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.gift.open .lidg{transform:translateY(-38px) scaleY(.42)}
.gift.open .treasure{opacity:1}
.gift .beam{position:absolute;left:50%;bottom:62%;width:78%;height:360%;margin-left:-39%;pointer-events:none;opacity:0;transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(255,236,170,.75),rgba(255,214,120,.28) 45%,transparent 90%);clip-path:polygon(34% 100%,66% 100%,100% 0,0 0);filter:blur(5px);transition:opacity 1s .5s}
.gift.open .beam{opacity:1}
.gift:not(.open):hover .chest{transform:scale(1.04) rotate(-1deg);transition:transform .4s}
#cMsg{display:none!important}
#nameBig{transition:opacity 1.6s!important}

.paper h3{color:#c2406f!important;text-shadow:none!important}
#typed{font-family:'Poem','Caveat',cursive!important;font-weight:600!important;font-size:clamp(1.35rem,2.9vw,1.9rem)!important;line-height:1.7!important;color:var(--ink)!important}
#typed::after{color:#c2406f!important}
#envPaper{padding:7vh 9vw!important}
#envPaper *{color:var(--ink)}
#chap{display:none!important}

#finBq{position:absolute;left:50%;bottom:2vh;width:min(30vh,250px);transform:translate(-50%,40px) scale(.7);opacity:0;pointer-events:none;transition:opacity 2.2s,transform 2.6s cubic-bezier(.2,.9,.25,1);filter:drop-shadow(0 18px 24px rgba(0,10,30,.55)) drop-shadow(0 0 28px rgba(255,170,200,.35));z-index:3}
#finBq .bqsvg{width:100%;height:auto;display:block}
#finBq.on{opacity:1;transform:translate(-50%,0) scale(1)}
#finalTxt{justify-content:flex-start!important;padding-top:6vh!important}

/* ---- final page v2 layout ---- */
#finalTxt{position:absolute;inset:0;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:center!important;gap:5vw;padding:5vh 6vw!important;background:none!important}
#finBq{position:relative!important;left:auto!important;bottom:auto!important;width:auto!important;height:min(62vh,540px);flex:0 0 auto;transform:translateY(40px) scale(.7)!important;transform-origin:50% 100%}
#finBq.on{transform:none!important}
#finBq .bqsvg{height:100%;width:auto;display:block}
#finRight{display:flex;flex-direction:column;align-items:center;gap:1.5vh;max-width:min(46vw,640px);min-width:0}
#heartAnchor{width:min(30vh,240px);height:min(22vh,180px);flex:0 0 auto}
#finPanel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.6vh;padding:3.6vh 3.2vw;border-radius:28px;background:rgba(6,24,52,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,170,205,.28);box-shadow:0 20px 60px rgba(0,10,30,.45)}
.finSm{font-size:.7rem;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,200,222,.8)}
#finalTitle{font-size:clamp(2.4rem,5.2vw,4.6rem)!important;line-height:1.1;margin:0}
#final #finalMsg{font-size:clamp(1.05rem,2.2vw,1.55rem);margin:0;max-width:520px;line-height:1.55}
.finBtns{display:flex;flex-wrap:wrap;gap:1.4vh 1.2vw;justify-content:center;margin-top:1vh}
.finBtns .btn{margin:0}
@media (max-aspect-ratio:1/1){
  #finalTxt{flex-direction:column!important;gap:2vh;padding:4vh 6vw!important}
  #finRight{order:1;max-width:92vw}
  #finBq{order:2;height:min(30vh,300px)}
  #heartAnchor{width:min(26vh,200px);height:min(15vh,130px)}
  #finPanel{padding:3vh 5vw}
}

/* ---- final page romantic glow ---- */
#finHearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
#finHearts i{position:absolute;bottom:-40px;font-style:normal;color:#ff9fc4;text-shadow:0 0 14px rgba(255,120,180,.8);animation:finUp linear infinite}
@keyframes finUp{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}12%{opacity:.75}50%{transform:translateY(-55vh) translateX(18px) scale(1)}100%{transform:translateY(-112vh) translateX(-14px) scale(1.15);opacity:0}}
#final.fin-on #finHearts i{opacity:1}
#finalTxt{z-index:3}
#finPanel{position:relative;background:linear-gradient(145deg,rgba(255,170,205,.26),rgba(120,64,160,.30) 52%,rgba(10,30,76,.46))!important;border:1px solid rgba(255,205,228,.55)!important;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 0 60px rgba(255,120,180,.38),0 24px 70px rgba(10,5,40,.55)!important}
#finPanel::before{content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;background:conic-gradient(from var(--fa,0deg),rgba(255,214,235,0),rgba(255,214,235,.95),rgba(255,214,235,0) 32%,rgba(255,214,235,0) 66%,rgba(255,170,215,.8),rgba(255,214,235,0));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:finSpin 7s linear infinite;pointer-events:none}
@property --fa{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes finSpin{to{--fa:360deg}}
#finalTitle{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#ffd3e6!important;text-shadow:0 0 22px rgba(255,120,180,.75),0 2px 14px rgba(40,10,60,.8)!important;filter:none!important}
.finSm{color:#ffd6e8!important;text-shadow:0 0 12px rgba(255,150,195,.6)}
.paper .sign{color:#b02e5c!important;font-family:'Poem','Romance',cursive;font-weight:600;font-size:2rem;text-align:right}

/* ===== polish v4 ===== */
/* 1 PIN screen */
#pinHeart{display:none;line-height:0;animation:pinBeat 1.8s ease-in-out infinite;margin-bottom:2vh;transition:transform .9s cubic-bezier(.3,.8,.2,1),opacity .8s}
#lock.pin #pinHeart{display:none!important}
#pinHeart svg{width:clamp(50px,9vh,76px);height:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,120,175,.9)) drop-shadow(0 0 28px rgba(255,120,175,.55))}
@keyframes pinBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}42%{transform:scale(1.1)}70%{transform:scale(1)}}
#lock.open #pinHeart{animation:none;transform:scale(3.4);opacity:0;transition:transform .85s cubic-bezier(.3,.8,.2,1),opacity .85s ease-in}
#lock.open #pinDots,#lock.open #pinPad{opacity:0;transition:opacity .5s}
/* 2 scene sweep */
#wave{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 15%,rgba(255,160,200,.22) 40%,rgba(130,205,255,.26) 55%,transparent 85%);transform:translateX(-110%)}
#wave.go{animation:waveSweep 1.5s ease-in-out}
@keyframes waveSweep{0%{opacity:0;transform:translateX(-110%)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(110%)}}
/* 3 polaroid paper + tape */
.pz{background:linear-gradient(162deg,#fffdf9,#f7f0e3 70%,#efe5d3);box-shadow:0 2px 3px rgba(40,25,10,.3),0 14px 30px rgba(60,40,20,.4),inset 0 0 0 1px rgba(255,255,255,.5)}
.pz.focus{box-shadow:0 3px 4px rgba(40,25,10,.3),0 30px 70px rgba(60,40,20,.55),0 0 90px rgba(255,200,160,.5)}
.pz::before{clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%);box-shadow:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28));opacity:.92}
.pz::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 28%,rgba(0,0,0,.05));mix-blend-mode:soft-light}
/* 4 letter fold */
.paper.fold{transform:perspective(900px) rotateX(78deg) scale(.55) translateY(160px)!important;opacity:0!important;transition:transform 1s cubic-bezier(.6,0,.4,1),opacity .9s .1s!important}
/* 5 final sequence */
#finPanel{opacity:0;transform:translateY(24px);transition:opacity 2.2s,transform 2.2s cubic-bezier(.2,.8,.2,1)}
#finPanel.show{opacity:1;transform:none}
#finBq{transition-duration:2.6s,3s!important}
/* 6 phone */
@media (max-width:600px){
  .btn{padding:16px 30px;font-size:.84rem;letter-spacing:.26em;min-height:52px}
  .hint{font-size:1rem}
  #pinPad{grid-template-columns:repeat(3,76px);gap:16px}#pinPad button{width:76px;height:76px;font-size:1.8rem}
  #finPanel .msg{font-size:1.05rem}
}
@keyframes lsp{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}
/* 8 theme: rose + midnight + champagne */
.eyebrow{color:#ffe3c4}
body::after{content:"";position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,10,28,.5) 100%)}
/* final panel: solid letter-like paper, not transparent */
#finPanel{background:linear-gradient(145deg,#fff2ed,#fbe4e9 55%,#f7d7e1)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid rgba(190,90,130,.35)!important;border-radius:22px!important;box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.55) inset!important}
#finPanel::before{display:none!important}
#finalTitle{color:#b02e5c!important;text-shadow:none!important}
.finSm{color:#a0486c!important;text-shadow:none!important}
#final #finalMsg,#finPanel .msg{color:#5a2a3e!important;text-shadow:none!important}
</style>
